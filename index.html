<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Baignoires Luxe – Vente en ligne</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet">

<style>
/* ----------------------------------------------------------
   Reset & variables
---------------------------------------------------------- */
*, *::before, *::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#8e44ad;          /* couleur principale */
  --secondary:#34495e;        /* couleur secondaire */
  --accent:#e67e22;           /* couleur d’accent */
  --bg:#f5f5f5;              /* couleur de fond */
  --text-light:#fff;          /* texte clair */
  --text-dark:#2c3e50;        /* texte sombre */
  --radius:8px;
}
body{font-family:'Roboto',sans-serif;line-height:1.6;color:var(--text-dark);background:var(--bg);}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}
img{max-width:100%;display:block;}
button{cursor:pointer;border:none;background:var(--accent);color:var(--text-light);border-radius:var(--radius);transition:background .3s;}
button:hover{background:var(--primary);}

/* ----------------------------------------------------------
   Header
---------------------------------------------------------- */
header{
  position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);
  background:rgba(255,255,255,.9);padding:1rem 2rem;
  display:flex;justify-content:space-between;align-items:center;
}
.logo{font-size:1.5rem;font-weight:700;color:var(--primary);}
nav ul{display:flex;gap:1.5rem;}
nav a{font-weight:600;color:var(--secondary);transition:color .3s;}
nav a:hover{color:var(--primary);}

/* ----------------------------------------------------------
   Hero section
---------------------------------------------------------- */
#hero{
  height:100vh;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;
  color:var(--text-light);background:url('https://images.unsplash.com/photo-1519681393784-d120267bc47e?auto=format&fit=crop&w=1400&q=80') no-repeat center/cover;
  position:relative;
}
#hero::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.7));
}
#hero .content{position:relative;z-index:1;}
#hero h1{font-size:3rem;margin-bottom:.5rem;}
#hero p{font-size:1.5rem;margin-bottom:1.5rem;}
#hero button{padding:.75rem 2rem;font-size:1rem;}
.scroll-down{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  animation: bounce 2s infinite;
}
.scroll-down svg{width:30px;height:30px;fill:var(--text-light);}
@keyframes bounce{
  0%,20%,50%,80%,100%{transform:translateY(0);}
  40%{transform:translateY(-10px);}
  60%{transform:translateY(-5px);}
}

/* ----------------------------------------------------------
   Products section
---------------------------------------------------------- */
#products{padding:4rem 2rem;background:var(--bg);text-align:center;}
#products h2{font-size:2.5rem;margin-bottom:2rem;color:var(--secondary);}
.products-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:2rem;
}
.product-card{
  background:var(--text-light);border-radius:var(--radius);
  overflow:hidden;box-shadow:0 10px 20px rgba(0,0,0,.1);
  transition:transform .3s,box-shadow .3s;
  opacity:0;transform:translateY(50px);transition:opacity .6s ease-out,transform .6s ease-out;
}
.product-card:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 20px 30px rgba(0,0,0,.2);}
.product-card.reveal.animate{opacity:1;transform:translateY(0);}
.product-image{height:180px;background-size:cover;background-position:center;}
.product-info{padding:1rem;text-align:center;}
.product-info h3{font-size:1.2rem;margin-bottom:.5rem;color:var(--secondary);}
.product-info p{color:var(--accent);font-weight:600;font-size:1.1rem;}

/* ----------------------------------------------------------
   Contact section
---------------------------------------------------------- */
#contact{padding:4rem 2rem;background:var(--secondary);color:var(--text-light);text-align:center;}
#contact h2{font-size:2.5rem;margin-bottom:1.5rem;}
#contact form{max-width:600px;margin:auto;display:grid;gap:1rem;}
#contact input,#contact textarea{padding:.75rem;border-radius:var(--radius);border:none;font-size:1rem;}
#contact input:focus,#contact textarea:focus{outline:none;box-shadow:0 0 5px var(--accent);}
#contact button{padding:.75rem 2rem;font-size:1rem;background:var(--accent);color:var(--text-light);}
#contact button:hover{background:var(--primary);}

/* ----------------------------------------------------------
   Footer
---------------------------------------------------------- */
footer{padding:1rem 2rem;text-align:center;background:var(--primary);color:var(--text-light);}
footer a{color:var(--text-light);margin:0 0.5rem;font-weight:600;}
footer a:hover{color:var(--accent);}

/* ----------------------------------------------------------
   Responsive
---------------------------------------------------------- */
@media(max-width:768px){
  #hero h1{font-size:2.2rem;}
  #hero p{font-size:1.2rem;}
  header{padding:1rem;}
  nav ul{gap:1rem;}
}
</style>
</head>
<body>

<header>
  <div class="logo">Baignoires Luxe</div>
  <nav>
    <ul>
      <li><a href="#hero">Accueil</a></li>
      <li><a href="#products">Produits</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<section id="hero">
  <div class="content">
    <h1>Confort et élégance</h1>
    <p>Des baignoires haut de gamme, conçues pour votre bien‑être.</p>
    <button>Découvrez nos modèles</button>
  </div>
  <div class="scroll-down">
    <svg viewBox="0 0 24 24">
      <path d="M12 4l-8 8h6v8h4v-8h6z"/>
    </svg>
  </div>
</section>

<section id="products">
  <h2>Nos modèles</h2>
  <div class="products-grid">
    <article class="product-card reveal">
      <div class="product-image" style="background-image:url('https://images.unsplash.com/photo-1606761443326-7d1bde6d3a1b?auto=format&fit=crop&w=600&q=80');"></div>
      <div class="product-info">
        <h3>Baie en marbre</h3>
        <p>€1 200</p>
      </div>
    </article>
    <article class="product-card reveal">
      <div class="product-image" style="background-image:url('https://images.unsplash.com/photo-1606787366857-2fbf6d2c6fe4?auto=format&fit=crop&w=600&q=80');"></div>
      <div class="product-info">
        <h3>Baignoire tubulaire</h3>
        <p>€1 800</p>
      </div>
    </article>
    <article class="product-card reveal">
      <div class="product-image" style="background-image:url('https://images.unsplash.com/photo-1598514984616-9b2c5a4b8c4d?auto=format&fit=crop&w=600&q=80');"></div>
      <div class="product-info">
        <h3>Baignoire en acier inox</h3>
        <p>€2 000</p>
      </div>
    </article>
    <!-- Ajoutez autant de cartes que nécessaire -->
  </div>
</section>

<section id="contact">
  <h2>Contactez‑nous</h2>
  <form>
    <input type="text" placeholder="Votre nom" required>
    <input type="email" placeholder="Votre e‑mail" required>
    <textarea rows="4" placeholder="Votre message" required></textarea>
    <button type="submit">Envoyer</button>
  </form>
</section>

<footer>
  <p>© 2024 Baignoires Luxe – Tous droits réservés</p>
</footer>

<script>
/* ----------------------------------------------------------
   IntersectionObserver pour les animations de scroll
---------------------------------------------------------- */
const observerOptions = {
  threshold: 0.15
};

const revealOnScroll = new IntersectionObserver((entries, observer) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('animate');
      observer.unobserve(entry.target);
    }
  });
}, observerOptions);

document.querySelectorAll('.reveal').forEach(el => {
  revealOnScroll.observe(el);
});
</script>

</body>
</html>
